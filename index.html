<style>
:root {
  --paper: #F4F1EA; --paper-2: #FBF9F4; --ink: #211F1A; --ink-strong: #111;
  --muted: #7A7368; --line: #E3DCCD; --accent: #2F5D57;
  --serif: "Songti SC", "Noto Serif SC", Georgia, serif;
  --sans: "PingFang SC", "Noto Sans SC", -apple-system, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #1C1A16; --paper-2: #24211C; --ink: #E6E1D6; --ink-strong: #F5F2EA;
          --muted: #9A9385; --line: #3A362E; --accent: #5E9C93; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);
       font-family: var(--sans); font-size: 17px; line-height: 1.8; }
.wrap { max-width: 744px; margin: 0 auto; padding: 0 26px 90px; }
header { padding: 72px 0 36px; border-bottom: 1px solid var(--line); }
.kicker { font: 600 12.5px/1 var(--mono); letter-spacing: .18em;
          text-transform: uppercase; color: var(--accent); margin: 0 0 18px; }
h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(30px, 5.6vw, 44px);
     line-height: 1.18; color: var(--ink-strong); margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
li { border-bottom: 1px solid var(--line); }
a { display: block; padding: 20px 2px; color: var(--ink); text-decoration: none; }
a:hover .t { color: var(--accent); }
.d { font: 600 12.5px/1 var(--mono); letter-spacing: .12em; color: var(--muted); }
.t { display: block; margin-top: 8px; font-family: var(--serif); font-weight: 600;
     font-size: 21px; line-height: 1.4; color: var(--ink-strong); }
@media (max-width: 560px) { body { font-size: 16px; } .wrap { padding: 0 18px 70px; }
  header { padding: 52px 0 28px; } }
</style>
